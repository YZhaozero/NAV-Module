# Source XYZ stays in base_footprint. extrinsic_R/T maps base -> physical IMU.
# Rcl/Pcl maps base -> camera optical, derived from the actual robot TF.
/**:
  ros__parameters:
    common:
      img_topic: /foo/camera_1/color/image_raw
      lid_topic: /foo/livox/lidar_192_168_128_3
      imu_topic: /foo/livox/imu_192_168_128_3
      imu_acc_scale: 9.80665
      imu_frame: livox_frame
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false
    extrin_calib:
      extrinsic_T:
      - -0.3733523804664971
      - 0.10465180361560908
      - -0.33
      extrinsic_R:
      - 0.7071067811865475
      - 0.7071067811865476
      - 0.0
      - -0.7071067811865476
      - 0.7071067811865475
      - 0.0
      - 0.0
      - 0.0
      - 1.0
      Rcl:
      - 0.024761963926227343
      - 0.9994311278034815
      - 0.02289685393187043
      - -0.010566504597285897
      - -0.022640938380205828
      - 0.9996878197166651
      - 0.999637531369802
      - -0.024996173441647417
      - 0.009999859507179524
      Pcl:
      - -0.021778085237990623
      - -0.2107274124093632
      - -0.40000570709166056
    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0
    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.1
      lidar_type: 8
      scan_line: 6
      blind: 0.5
    vio:
      max_iterations: 5
      outlier_threshold: 1000
      img_point_cov: 100
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1
    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.5
      gyr_cov: 0.3
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.05
      min_eigen_value: 0.0025
      voxel_size: 0.5
      max_layer: 2
      max_points_num: 50
      layer_init_num:
      - 5
      - 5
      - 5
      - 5
      - 5
    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0
    uav:
      imu_rate_odom: false
      gravity_align_en: false
    publish:
      dense_map_en: true
      pub_effect_point_en: true
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0
    evo:
      seq_name: woosh_livox3_camera1
      pose_output_en: false
    pcd_save:
      pcd_save_en: false
      type: 0
      colmap_output_en: false
      filter_size_pcd: 0.15
      interval: -1
    image_save:
      img_save_en: false
      interval: 1
