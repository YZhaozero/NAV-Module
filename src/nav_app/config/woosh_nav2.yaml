global_costmap.global_costmap.ros__parameters.obstacle_layer.scan.topic: /foo/scan
velocity_smoother.ros__parameters.odom_topic: /dlio/odom_node/odom
velocity_smoother.ros__parameters.max_velocity: [0.20, 0.0, 0.40]
velocity_smoother.ros__parameters.min_velocity: [-0.20, 0.0, -0.40]
planner_server.ros__parameters.GridBased.allow_unknown: false

# Mapped from ROS1 /move_base on WOOSH, read on 2026-11-14.
# Keep the existing 0.20 m/s and 0.40 rad/s caps; execution remains disabled.
controller_server.ros__parameters.controller_frequency: 8.0
controller_server.ros__parameters.FollowPath.acc_lim_x: 0.4
controller_server.ros__parameters.FollowPath.acc_lim_theta: 0.45
controller_server.ros__parameters.FollowPath.decel_lim_x: -0.7
controller_server.ros__parameters.FollowPath.decel_lim_theta: -0.5
controller_server.ros__parameters.general_goal_checker.xy_goal_tolerance: 0.05
