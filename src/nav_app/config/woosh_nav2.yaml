bt_navigator.ros__parameters.robot_base_frame: base_link
bt_navigator.ros__parameters.odom_topic: /dlio/odom_node/odom
controller_server.ros__parameters.odom_topic: /dlio/odom_node/odom
controller_server.ros__parameters.FollowPath.max_vel_x: 0.20
controller_server.ros__parameters.FollowPath.max_vel_y: 0.0
controller_server.ros__parameters.FollowPath.max_vel_theta: 0.40
controller_server.ros__parameters.FollowPath.max_speed_xy: 0.20
local_costmap.local_costmap.ros__parameters.robot_base_frame: base_link
local_costmap.local_costmap.ros__parameters.global_frame: odom
local_costmap.local_costmap.ros__parameters.footprint: '[[0.29,0.23],[0.235,0.275],[-0.235,0.275],[-0.29,0.23],[-0.29,-0.23],[-0.235,-0.275],[0.235,-0.275],[0.29,-0.23]]'
